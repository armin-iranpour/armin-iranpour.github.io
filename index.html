<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armin Iranpour – Maschinenbauingenieur</title>
<meta name="description" content="Armin Iranpour – Maschinenbauingenieur, M.Sc.-Student an der TU Dortmund.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0; --ink:#1b1f27; --ink-2:#4a505c; --muted:#767c88; --rule:#dedad2; --rule-strong:#1b1f27;
  --accent:#1e3a5f; --accent-ink:#ffffff; --photo-bg:#e9e6df;
  --serif:"Source Serif 4",Georgia,serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gutter:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131519; --ink:#ebe8e2; --ink-2:#b9bcc4; --muted:#8a8f9a; --rule:#2b2f37; --rule-strong:#ebe8e2;
    --accent:#9db8dc; --accent-ink:#0f1726; --photo-bg:#22252b;
  }
}
:root[data-theme="dark"]{
  --bg:#131519; --ink:#ebe8e2; --ink-2:#b9bcc4; --muted:#8a8f9a; --rule:#2b2f37; --rule-strong:#ebe8e2;
  --accent:#9db8dc; --accent-ink:#0f1726; --photo-bg:#22252b;
}
@media (min-width:720px){ :root{ --gutter:40px; } }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gutter)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* header */
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:72px}
.brand{font:600 17px/1 var(--serif);text-decoration:none}
.nav{display:flex;align-items:center;gap:28px;font-size:14px}
.nav a{text-decoration:none;color:var(--ink-2);padding:10px 0;transition:color .15s}
.nav a:hover{color:var(--ink)}
.nav .lang{border:1px solid var(--rule);padding:6px 10px;color:var(--ink);font-weight:500;font-size:13px;letter-spacing:.04em}
.nav .lang:hover{border-color:var(--ink)}
@media (max-width:700px){ .nav .sec{display:none} }

/* hero */
.hero{padding:64px 0 96px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:72px;align-items:center}
h1{font:500 clamp(40px,6vw,64px)/1.02 var(--serif);letter-spacing:-.02em;margin:0 0 20px}
.tagline{font:400 clamp(20px,2.3vw,26px)/1.35 var(--serif);margin:0 0 14px;max-width:24em;color:var(--ink)}
.bio{font-size:17px;color:var(--ink-2);margin:0 0 32px;max-width:32em}
.actions{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:500;font-size:15px;padding:13px 20px;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn svg{width:16px;height:16px}
.link{font-size:15px;font-weight:500;text-decoration:none;border-bottom:1px solid var(--rule-strong);padding-bottom:2px}
.link:hover{color:var(--accent);border-color:var(--accent)}
.portrait{margin:0;background:var(--photo-bg);aspect-ratio:4/5;overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}

/* sections */
.block{padding:72px 0;border-top:1px solid var(--rule)}
h2{font:500 15px/1 var(--sans);color:var(--muted);margin:0 0 36px}

.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 64px}
.project{border-top:1px solid var(--rule-strong);padding-top:18px}
.project .meta{font-size:13px;color:var(--muted);margin:0 0 10px}
.project h3{font:500 23px/1.25 var(--serif);margin:0 0 10px;letter-spacing:-.005em}
.project p{margin:0;color:var(--ink-2)}
.project .result{margin-top:14px;color:var(--ink);font-weight:600}
.project .tools{margin-top:2px;font-size:14px;color:var(--muted)}

.path{margin:0;padding:0;list-style:none}
.path li{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;padding:16px 0;border-top:1px solid var(--rule)}
.path li:last-child{border-bottom:1px solid var(--rule)}
.path .when{color:var(--muted);font-size:14.5px;font-variant-numeric:tabular-nums;padding-top:2px}
.path b{display:block;font-weight:600}
.path span{color:var(--ink-2);font-size:15px}
.more{display:inline-block;margin-top:28px}

.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 32px;margin:0}
.skills dt{font-weight:600;margin-bottom:4px}
.skills dd{margin:0;color:var(--ink-2);font-size:15px}

.contact{padding:72px 0 72px;border-top:1px solid var(--rule-strong)}
.mail{font:400 clamp(24px,3vw,34px)/1.2 var(--serif);text-decoration:none;border-bottom:1px solid var(--rule-strong);overflow-wrap:anywhere}
.mail:hover{color:var(--accent);border-color:var(--accent)}
.channels{display:flex;flex-wrap:wrap;gap:10px 32px;margin:24px 0 0;padding:0;list-style:none;font-size:15px;color:var(--ink-2)}
.channels a{text-decoration:none;border-bottom:1px solid var(--rule)}
.channels a:hover{color:var(--ink);border-color:var(--ink)}
footer{border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:22px}

@media (max-width:860px){
  .hero{padding:32px 0 64px}
  .hero .wrap{grid-template-columns:minmax(0,1fr);gap:32px}
  .portrait{width:180px;order:-1}
  .projects{grid-template-columns:minmax(0,1fr);gap:40px}
  .skills{grid-template-columns:repeat(2,minmax(0,1fr))}
  .block{padding:56px 0}
}
@media (max-width:560px){
  .path li{grid-template-columns:minmax(0,1fr);gap:2px}
  .skills{grid-template-columns:minmax(0,1fr)}
  footer .wrap{flex-direction:column;gap:4px}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top">Armin Iranpour</a>
    <nav class="nav" id="nav" aria-label="Navigation"></nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <h1>Armin Iranpour</h1>
        <p class="tagline" id="tagline"></p>
        <p class="bio" id="bio"></p>
        <div class="actions" id="actions"></div>
      </div>
      <figure class="portrait"><img src="armin.jpg" alt="Armin Iranpour" width="720" height="720"></figure>
    </div>
  </section>

  <section class="block" id="proj"><div class="wrap"><h2></h2><div class="projects"></div></div></section>
  <section class="block" id="path"><div class="wrap"><h2></h2><ol class="path"></ol><a class="link more" id="more"></a></div></section>
  <section class="block" id="skills"><div class="wrap"><h2></h2><dl class="skills"></dl></div></section>
  <section class="contact" id="contact"><div class="wrap"><div id="contactBody"></div></div></section>
</main>

<footer><div class="wrap"><span id="foot"></span><span id="footR"></span></div></footer>

<script src="content.js"></script>
<script>
const $ = s => document.querySelector(s);
const DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg>';
let lang = pickLang();

function render(){
  const C = CONTENT[lang], S = C.site, N = C.nav, other = N.other.toLowerCase();
  document.documentElement.lang = lang;
  document.title = C.title;
  document.querySelector('meta[name="description"]').content = C.description;

  $("#nav").innerHTML =
    ["proj","path","contact"].map(k => `<a class="sec" href="#${k}">${N[k]}</a>`).join("") +
    `<a class="lang" href="?lang=${other}" data-lang="${other}" aria-label="${N.otherLabel}">${N.other}</a>`;

  $("#tagline").textContent = S.tagline;
  $("#bio").textContent = S.bio;
  $("#actions").innerHTML =
    `<a class="btn" href="${PERSON.cvPdf[lang]}" download>${DL}${C.ctaCv}</a>
     <a class="link" href="mailto:${PERSON.email}">${C.ctaMail}</a>`;

  $("#proj h2").textContent = S.projTitle;
  $("#proj .projects").innerHTML = S.projects.map(p => `
    <article class="project">
      <p class="meta">${esc(p.meta)}</p>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.text)}</p>
      <p class="result">${esc(p.result)}</p>
      <p class="tools">${esc(p.tools)}</p>
    </article>`).join("");

  $("#path h2").textContent = S.pathTitle;
  $("#path .path").innerHTML = S.path.map(([w,t,o]) =>
    `<li><span class="when">${esc(w)}</span><div><b>${esc(t)}</b><span>${esc(o)}</span></div></li>`).join("");
  $("#more").href = PERSON.cvPdf[lang];
  $("#more").setAttribute("download", "");
  $("#more").textContent = C.ctaCvFull + " →";

  $("#skills h2").textContent = S.skillsTitle;
  $("#skills .skills").innerHTML = S.skills.map(([g,t]) => `<div><dt>${esc(g)}</dt><dd>${esc(t)}</dd></div>`).join("");

  $("#contactBody").innerHTML = `
    <h2>${esc(C.contactTitle)}</h2>
    <a class="mail" href="mailto:${PERSON.email}">${PERSON.email}</a>
    <ul class="channels">
      <li><a href="tel:${PERSON.phone.replace(/\s/g,"")}">${PERSON.phone}</a></li>
      <li><a href="https://${PERSON.linkedin}" target="_blank" rel="noopener">LinkedIn</a></li>
      <li>${esc(C.location)}</li>
    </ul>`;

  $("#foot").textContent = `© ${new Date().getFullYear()} ${C.footer}`;
  $("#footR").innerHTML = `<a href="?lang=${other}" data-lang="${other}">${N.otherLabel}</a>`;
  saveLang(lang);
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-lang]");
  if (!a) return;
  e.preventDefault(); lang = a.dataset.lang; render();
});
render();
</script>
</body>
</html>
